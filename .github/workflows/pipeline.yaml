name: CI Pipeline

on:
  push:
    branches:
      - main
      - "release/**"

    paths:
      - "src/**"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 26
      # - name: Install dependencies
      #   run: npm install

      - name: Run tests
        run: npm test
